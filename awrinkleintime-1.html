
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unlock</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: 'Inter', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* ---------- PAGE ---------- */

.page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 65px 15px;
    position: relative;
}

/* ---------- BACK BUTTON ---------- */

.back-button {
    position: absolute;
    top: 30px;
    left: 35px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 15px;
    color: #ddd;
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid #383838;
    border-radius: 5px;
    transition: background 0.2s ease, color 0.2s ease;
}

.back-button:hover {
    background: #202020;
    color: white;
}

.back-arrow {
    font-size: 17px;
    line-height: 1;
}

/* ---------- IPHONE FRAME ---------- */

.phone {
    width: 290px;
    height: 585px;
    background: #171717;
    border: 3px solid #454545;
    border-radius: 46px;
    padding: 9px;
    position: relative;
    box-shadow: none;
    transition: transform 0.4s ease;
}

.phone:hover {
    transform: translateY(-5px);
}

/* Side buttons */

.side-button {
    position: absolute;
    width: 3px;
    background: #555;
    border-radius: 3px;
    left: -5px;
}

.side-button.one {
    top: 105px;
    height: 35px;
}

.side-button.two {
    top: 155px;
    height: 55px;
}

.side-button.three {
    top: 220px;
    height: 55px;
}

.power-button {
    position: absolute;
    width: 3px;
    height: 75px;
    right: -5px;
    top: 160px;
    background: #555;
    border-radius: 3px;
}

/* ---------- PHONE SCREEN ---------- */

.screen {
    width: 100%;
    height: 100%;
    border-radius: 36px;
    overflow: hidden;
    position: relative;
    background: #090909;
}

.off-screen {
    position: absolute;
    inset: 0;
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 5;
    transition: opacity 0.7s ease, visibility 0.7s ease;
}

.off-screen span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #171717;
}

/* ---------- LOCK SCREEN ---------- */

.lock-screen {
    position: absolute;
    inset: 0;
    padding: 22px 15px 16px;
    background:
        radial-gradient(ellipse at 20% 30%, rgba(174, 133, 112, 0.45), transparent 45%),
        radial-gradient(ellipse at 80% 65%, rgba(93, 66, 73, 0.6), transparent 48%),
        linear-gradient(155deg, #25232b 0%, #5a4647 42%, #17181e 100%);
    opacity: 0;
    transition: opacity 0.8s ease 0.15s;
}

/* Turn on the screen when hovered or tapped */

.phone:hover .off-screen,
.phone.is-on .off-screen {
    opacity: 0;
    visibility: hidden;
}

.phone:hover .lock-screen,
.phone.is-on .lock-screen {
    opacity: 1;
}

/* ---------- STATUS BAR ---------- */

.status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 600;
    padding: 0 9px;
    height: 19px;
    color: #fff;
}

.status-icons {
    display: flex;
    align-items: center;
    gap: 5px;
}

.signal {
    display: flex;
    gap: 2px;
    align-items: flex-end;
    height: 12px;
}

.signal span {
    width: 3px;
    background: white;
    border-radius: 1px;
}

.signal span:nth-child(1) { height: 4px; }
.signal span:nth-child(2) { height: 6px; }
.signal span:nth-child(3) { height: 8px; }
.signal span:nth-child(4) { height: 10px; }

.battery {
    width: 19px;
    height: 9px;
    border: 1px solid white;
    border-radius: 2px;
    position: relative;
}

.battery::before {
    content: "";
    position: absolute;
    width: 12px;
    height: 5px;
    background: white;
    left: 2px;
    top: 1px;
    border-radius: 1px;
}

.battery::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 4px;
    background: white;
    right: -4px;
    top: 2px;
    border-radius: 0 2px 2px 0;
}

/* ---------- DYNAMIC ISLAND ---------- */

.dynamic-island {
    position: absolute;
    width: 95px;
    height: 26px;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    background: #050505;
    border-radius: 20px;
    z-index: 4;
}

/* ---------- CLOCK ---------- */

.clock-area {
    text-align: center;
    margin-top: 48px;
    color: white;
}

.lock-icon {
    font-size: 15px;
    margin-bottom: 8px;
}

.date {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 2px;
}

.time {
    font-size: 64px;
    line-height: 1.1;
    letter-spacing: -4px;
    font-weight: 400;
}

/* ---------- TAP TO UNLOCK ---------- */

.unlock-link {
    position: absolute;
    bottom: 68px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    text-align: center;
    text-decoration: none;
    color: rgba(255, 255, 255, 0.9);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
    opacity: 0;
    transition: opacity 0.5s ease 0.3s;
    cursor: pointer;
}

.phone:hover .unlock-link,
.phone.is-on .unlock-link {
    opacity: 1;
}

.unlock-link span {
    display: inline-block;
    padding: 10px 17px;
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 25px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(8px);
    transition:
        background 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease;
}

.unlock-link:hover span {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.8);
    transform: translateY(-2px);
}

/* ---------- BOTTOM SHORTCUTS ---------- */

.bottom-area {
    position: absolute;
    bottom: 23px;
    left: 0;
    width: 100%;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.shortcut {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(20, 20, 20, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 15px;
    color: white;
}

.home-indicator {
    position: absolute;
    width: 95px;
    height: 4px;
    background: white;
    border-radius: 5px;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
}

/* ---------- HINT ---------- */

.hover-hint {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: #777;
    font-size: 11px;
    letter-spacing: 1px;
    text-align: center;
    white-space: nowrap;
    transition: opacity 0.3s ease;
}

.phone:hover ~ .hover-hint,
.phone.is-on ~ .hover-hint {
    opacity: 0;
}

/* ---------- MOBILE ---------- */

@media (max-width: 500px) {
    .page {
        padding: 75px 15px 65px;
    }

    .back-button {
        top: 18px;
        left: 18px;
    }

    .phone {
        width: 265px;
        height: 535px;
    }

    .clock-area {
        margin-top: 40px;
    }

    .time {
        font-size: 58px;
    }

    .unlock-link {
        bottom: 62px;
    }

    .hover-hint {
        bottom: 18px;
        font-size: 9px;
    }
}

/* ---------- SHORT SCREENS ---------- */

@media (max-height: 700px) {
    .page {
        padding-top: 55px;
        padding-bottom: 55px;
    }

    .phone {
        transform: scale(0.88);
    }

    .phone:hover {
        transform: scale(0.88) translateY(-5px);
    }
}

/* ---------- ACCESSIBILITY ---------- */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<main class="page">

    <a
        href="https://readymag.website/u1336336204/awrinkleintime/"
        class="back-button">
        <span class="back-arrow">←</span>
        <span>Back</span>
    </a>

    <div class="phone" id="phone" aria-label="iPhone lock screen">

        <div class="side-button one"></div>
        <div class="side-button two"></div>
        <div class="side-button three"></div>
        <div class="power-button"></div>

        <div class="screen">

            <div class="off-screen">
                <span></span>
            </div>

            <div class="lock-screen">

                <div class="status-bar">
                    <span id="statusTime">09:41</span>

                    <div class="status-icons">
                        <div class="signal">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>

                        <span style="font-size: 12px;">⌁</span>
                        <div class="battery"></div>
                    </div>
                </div>

                <div class="dynamic-island"></div>

                <div class="clock-area">
                    <div class="lock-icon">♙</div>
                    <div class="date" id="date">Monday, 13 October</div>
                    <div class="time" id="clock">09:41</div>
                </div>

                <a
                    href="https://readymag.website/u1336336204/awrinkleintime/"
                    class="unlock-link"
                    aria-label="Tap to unlock and enter the story">
                    <span>Tap to unlock ↑</span>
                </a>

                <div class="bottom-area">
                    <div class="shortcut">◉</div>
                    <div class="shortcut">⌁</div>
                </div>

                <div class="home-indicator"></div>

            </div>

        </div>

    </div>

    <div class="hover-hint" id="hint">
        HOVER OVER THE PHONE TO TURN IT ON
    </div>

</main>

<script>
const phone = document.getElementById("phone");

/* Update the lock screen clock and date */

function updateClock() {
    const now = new Date();

    const time = now.toLocaleTimeString("en-ZA", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
    });

    const date = now.toLocaleDateString("en-ZA", {
        weekday: "long",
        day: "numeric",
        month: "long"
    });

    document.getElementById("clock").textContent = time;
    document.getElementById("statusTime").textContent = time;
    document.getElementById("date").textContent = date;
}

updateClock();
setInterval(updateClock, 30000);

/* Allow tapping the phone to turn it on */

phone.addEventListener("click", function(event) {
    if (event.target.closest(".unlock-link")) {
        return;
    }

    phone.classList.add("is-on");
});
</script>

</body>
</html>
